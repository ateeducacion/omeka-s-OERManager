name: CI

on:
  pull_request:
  push:
    tags:
      - '*'
    branches:
      - '**'

permissions:
  contents: read

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Checkout the code
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: PHP setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'  # Runtime target del modulo (NFR-007)
          coverage: pcov
          extensions: mbstring, intl, curl, dom, json, pdo, mysql, xml, zip
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install gettext
        run: sudo apt-get install -y gettext

      - name: Check untranslated strings
        run: make check-untranslated

      - name: Compile translations
        run: make compile-mo

      - name: Run code linting
        run: make lint

      - name: Run unit tests with coverage
        # PCOV defaults to src/, which would omit the module entry point.
        run: |
          rm -f coverage.xml
          php -d pcov.directory=. -d pcov.exclude='~/(vendor|test)/~' vendor/bin/phpunit -c test/phpunit.xml --coverage-clover coverage.xml --coverage-text

      - name: Enforce 90% line coverage
        run: php test/check-coverage.php coverage.xml 90

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true

      - name: Run JS core tests
        run: make test-js
