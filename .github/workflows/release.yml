name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    # Privilegio minimo: solo este job necesita escribir (crear la Release)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required to get full history for release notes

      - name: PHP setup
        # Acciones de terceros ancladas a SHA completo (supply-chain, NFR-009);
        # Dependabot (.github/dependabot.yml) mantiene los pines al dia.
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, curl, dom, json, pdo, mysql, xml, zip
          tools: composer

      - name: Install dependencies (no dev)
        run: composer install --no-interaction --prefer-dist --no-dev

      - name: Set environment variables
        run: |
          # Omeka espera la version sin el prefijo 'v' en module.ini / nombre del ZIP
          echo "RELEASE_TAG=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Generate Release Notes
        id: notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s (%h)" HEAD | head -20)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD)
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create package using the Makefile
        run: make package VERSION=${RELEASE_TAG}

      - name: Create Release and Upload ZIP
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          files: OERManager-${{ env.RELEASE_TAG }}.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## 📦 Changes in ${{ github.ref_name }}

            ${{ steps.notes.outputs.notes }}

            ## 📥 Installation
            Download the ZIP file and extract it to your Omeka S modules directory.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
